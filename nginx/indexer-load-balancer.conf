user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        'upstream="$upstream_addr" '
        'upstream_status="$upstream_status" '
        'request_time="$request_time" '
        'upstream_time="$upstream_response_time"';

    access_log /dev/stdout main;

    sendfile on;

    client_max_body_size 100M;

    # Docker embedded DNS.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;


    # ---------------------------------------------------
    # Indexer replica pool
    # ---------------------------------------------------
    upstream indexer_backend {
        zone indexer_backend 64k;

        # Prefer replicas with fewer active requests.
        least_conn;

        server indexer-api:8000 resolve
            max_fails=3
            fail_timeout=10s;

        keepalive 32;
    }


    # ---------------------------------------------------
    # Internal indexer load balancer
    # ---------------------------------------------------
    server {
        listen 8080;
        server_name _;

        # Only checks this Nginx container.
        location = /health {
            access_log off;
            default_type application/json;

            return 200
                '{"status":"ok","service":"indexer-load-balancer"}';
        }

        # /health/ready is intentionally not intercepted.
        # It is forwarded to an indexer replica.
        location / {
            proxy_pass http://indexer_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 15s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;

            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}