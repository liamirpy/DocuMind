user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        'upstream="$upstream_addr" '
        'upstream_status="$upstream_status" '
        'request_time="$request_time" '
        'upstream_time="$upstream_response_time"';

    access_log /dev/stdout main;

    sendfile on;

    # Change this if ingestor accepts larger requests.
    client_max_body_size 100M;

    # Docker embedded DNS.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # ---------------------------------------------------
    # Ingestor API replica pool
    # ---------------------------------------------------
    upstream ingestor_backend {
        zone ingestor_backend 64k;

        least_conn;

        # Compose service name and internal container port.
        server ingestor-api:8080 resolve;

        keepalive 32;
    }

    # ---------------------------------------------------
    # Internal load-balancer server
    # ---------------------------------------------------
    server {
        listen 8080;
        server_name _;

        # Checks only this Nginx container.
        location = /health {
            access_log off;
            default_type application/json;

            return 200
                '{"status":"ok","service":"ingestor-load-balancer"}';
        }

        # Checks Nginx and the ingestor backend.
        location = /health/ready {
            access_log off;

            proxy_pass http://ingestor_backend/health/ready;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_send_timeout 25s;
            proxy_read_timeout 25s;
        }

        # Send application requests to an ingestor replica.
        location / {
            proxy_pass http://ingestor_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 15s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;

            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}