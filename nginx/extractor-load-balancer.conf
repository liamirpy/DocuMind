user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        'upstream="$upstream_addr" '
        'upstream_status="$upstream_status" '
        'request_time="$request_time" '
        'upstream_time="$upstream_response_time"';

    access_log /dev/stdout main;

    sendfile on;

    # Maximum uploaded PDF size.
    client_max_body_size 100M;

    # Docker's internal DNS resolver.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;


    # ---------------------------------------------------
    # Extractor API replica pool
    # ---------------------------------------------------
    upstream extractor_backend {
        # Required for dynamically resolved upstreams.
        zone extractor_backend 64k;

        # Appropriate for long-running PDF extraction jobs.
        least_conn;

        # Docker DNS resolves the extractor-api service
        # to the running extractor replicas.
        server extractor-api:8000 resolve;

        keepalive 32;
    }


    # ---------------------------------------------------
    # Internal load-balancer server
    # ---------------------------------------------------
    server {
        listen 8080;
        server_name _;

        # Health of this Nginx container.
        location = /health {
            access_log off;
            default_type application/json;

            return 200
                '{"status":"ok","service":"extractor-load-balancer"}';
        }

        # Send every other request to an extractor replica.
        location / {
            proxy_pass http://extractor_backend;

            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For
                $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extraction and model processing can take time.
            proxy_connect_timeout 15s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;

            # Stream large uploads instead of storing the
            # complete PDF in Nginx temporary storage first.
            proxy_request_buffering off;

            # Stream long responses directly to Express.
            proxy_buffering off;
        }
    }
}