x-backend-common: &backend-common
  image: documind/backend-api:${BACKEND_IMAGE_TAG:-local}

  build:
    context: .
    dockerfile: Dockerfile
    target: runtime

  env_file:
    - ./.env

  environment:
    NODE_ENV: production
    PORT: "3000"

  init: true
  restart: unless-stopped

  volumes:
    - ../data/users:/data/users

  networks:
    - backend_network


services:
  api:
    <<: *backend-common

    command:
      - npm
      - start

    expose:
      - "3000"


  document-worker:
    <<: *backend-common

    command:
      - npm
      - run
      - worker:documents

    healthcheck:
      disable: true

    stop_grace_period: 30s
