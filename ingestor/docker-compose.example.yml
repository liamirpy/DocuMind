services:
  ingestor:
    build:
      context: .
    image: documind-ingestor:1.2.0
    env_file:
      - .env
    volumes:
      # Mount the indexer's output root read-only.
      - ${INDEXER_OUTPUT_HOST_DIR}:/input:ro
    networks:
      - documind
    restart: "no"

networks:
  documind:
    external: true
