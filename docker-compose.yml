name: documind

include:
  # ---------------------------------------------------
  # PostgreSQL stack
  # ---------------------------------------------------
  - path: ./postgreSQL/docker-compose_ngnix.yml
    env_file: ./postgreSQL/.env

  # ---------------------------------------------------
  # PaperMind GPU stack
  # ---------------------------------------------------
  - path:
      - ./paperMind/compose.nginx.yaml
      - ./paperMind/compose.nvidia.nginx.yaml
    project_directory: ./paperMind
    env_file: ./paperMind/.env

  # ---------------------------------------------------
  # Document indexer
  # ---------------------------------------------------
  - path: ./indexer/docker-compose.nginx.yml
    project_directory: ./indexer
    env_file: ./indexer/.env

 # ---------------------------------------------------
  # OpenSearch
  # ---------------------------------------------------
  - path: ./opensearch/docker-compose.nginx.yml
    project_directory: ./opensearch



 # ---------------------------------------------------
  # Ingester
  # ---------------------------------------------------
  - path: ./ingestor/compose.nginx.yml
    project_directory: ./ingestor




services:

  # ---------------------------------------------------
  # Public Nginx
  # ---------------------------------------------------
  public-nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - type: bind
        source: ./nginx/public.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      api:
        condition: service_started

    networks:
      - public_network


  # ---------------------------------------------------
  # Express API
  # ---------------------------------------------------
  api:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: ./backend-api
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend-api/.env

    environment:
      NODE_ENV: development


    expose:
      - "3000"

    volumes:
      - ./backend-api:/app
      - backend_node_modules:/app/node_modules
      - ./data/users:/data/users

    command: npm run dev

    depends_on:
      pgbouncer:
        condition: service_started

      redis:
        condition: service_healthy

      agent-load-balancer:
        condition: service_healthy

      # opensearch:
      #   condition: service_healthy

    networks:
      - public_network
      - application_network
      - documind
      - default


  # ---------------------------------------------------
  # Document-processing worker
  # ---------------------------------------------------
  document-worker:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: ./backend-api
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend-api/.env

    environment:
      NODE_ENV: development

    volumes:
      - ./backend-api:/app
      - backend_node_modules:/app/node_modules
      - ./data/users:/data/users

    command: npm run worker:documents

    depends_on:
      redis:
        condition: service_healthy

      pgbouncer:
        condition: service_started

      agent-api:
        condition: service_healthy

      agent-load-balancer:
        condition: service_healthy

      # opensearch:
      #   condition: service_healthy

    networks:
      # PaperMind and indexer included services use
      # the default Compose network.
      - default

      # Redis
      - application_network

      # PostgreSQL/PgBouncer
      - documind


  # ---------------------------------------------------
  # Redis
  # ---------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - application_network


  # ---------------------------------------------------
  # PaperMind extractor load balancer
  # ---------------------------------------------------
  agent-load-balancer:
    image: nginx:alpine
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - type: bind
        source: ./nginx/pdfMind-agent-load-balancer.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      agent-api:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/health/ready
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - default
      - application_network



  

  # ---------------------------------------------------
  # Indexer Nginx load balancer
  # ---------------------------------------------------
  indexer-load-balancer:
    image: nginx:alpine
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - type: bind
        source: ./nginx/indexer-load-balancer.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      indexer-api:
        condition: service_started

    healthcheck:
      # This passes through Nginx to the indexer backend,
      # so it checks both Nginx and at least one indexer.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/health/ready
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

    networks:
      - default
      

  # ---------------------------------------------------
  # Ingestor Nginx load balancer
  # ---------------------------------------------------
  ingestor-load-balancer:
    image: nginx:alpine
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - type: bind
        source: ./nginx/ingestor-load-balancer.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      ingestor-api:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/health/ready
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

    networks:
      - default








volumes:
  backend_node_modules:
  redis_data:


networks:
  default:
  public_network:
  application_network:




