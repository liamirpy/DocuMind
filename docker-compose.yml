name: documind

include:
  # ---------------------------------------------------
  # PostgreSQL 
  # ---------------------------------------------------
  - path: ./postgreSQL/docker-compose-ngnix.yml
    env_file: ./postgreSQL/.env

 # ---------------------------------------------------
  # OpenSearch
  # ---------------------------------------------------
  - path: ./opensearch/docker-compose-nginx.yml
    project_directory: ./opensearch


  # ---------------------------------------------------
  # PaperMind GPU 
  # ---------------------------------------------------
  - path:
      - ./paperMind/compose-nginx.yaml
      - ./paperMind/compose-nvidia-nginx.yaml
    project_directory: ./paperMind
    env_file: ./paperMind/.env

  # ---------------------------------------------------
  # Document indexer
  # ---------------------------------------------------
  - path: ./indexer/docker-compose-nginx.yml
    project_directory: ./indexer
    env_file: ./indexer/.env



 # ---------------------------------------------------
  # Ingester
  # ---------------------------------------------------
  - path: ./ingester/compose-nginx.yml
    project_directory: ./ingester




services:

  # ---------------------------------------------------
  # Public Nginx
  # ---------------------------------------------------
  public-nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - type: bind
        source: ./nginx/public.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      - frontend
        
    networks:
      - public_network
  

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    expose:
      - "3000"

    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      API_PROXY_TARGET: "http://api:3000"

    depends_on:
      - api

    networks:
      - public_network
      - backend_network

    restart: unless-stopped


  # ---------------------------------------------------
  # Express API
  # ---------------------------------------------------
  api:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: ./backend-api
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend-api/.env

    environment:
      NODE_ENV: development


    expose:
      - "3000"

    volumes:
      - ./backend-api:/app
      - backend_node_modules:/app/node_modules
      - ./data/users:/data/users

    command: npm run dev

    depends_on:
      pgbouncer:
        condition: service_started

      redis:
        condition: service_healthy

      agent-load-balancer:
        condition: service_healthy

      # opensearch:
      #   condition: service_healthy

    networks:
      - backend_network

      # - application_network
      # - documind
      # - default


  # ---------------------------------------------------
  # Document-processing worker
  # ---------------------------------------------------
  document-worker:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

    build:
      context: ./backend-api
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - ./backend-api/.env

    environment:
      NODE_ENV: development

    volumes:
      - ./backend-api:/app
      - backend_node_modules:/app/node_modules
      - ./data/users:/data/users

    command: npm run worker:documents

    depends_on:
      redis:
        condition: service_healthy

      pgbouncer:
        condition: service_started

      agent-api:
        condition: service_healthy

      agent-load-balancer:
        condition: service_healthy

      # opensearch:
      #   condition: service_healthy

    networks:
      # PaperMind and indexer included services use
      # the default Compose network.
      # - default
      - backend_network

      # Redis
      # - application_network

      # PostgreSQL/PgBouncer
      # - documind


  # ---------------------------------------------------
  # Redis
  # ---------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    networks:
      - backend_network


  # ---------------------------------------------------
  # PaperMind extractor load balancer
  # ---------------------------------------------------
  agent-load-balancer:
    image: nginx:alpine
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - type: bind
        source: ./nginx/pdfMind-agent-load-balancer.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      agent-api:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/health/ready
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

    networks:
      - backend_network



  

  # ---------------------------------------------------
  # Indexer Nginx load balancer
  # ---------------------------------------------------
  indexer-load-balancer:
    image: nginx:alpine
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - type: bind
        source: ./nginx/indexer-load-balancer.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      indexer-api:
        condition: service_started

    healthcheck:
      # This passes through Nginx to the indexer backend,
      # so it checks both Nginx and at least one indexer.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/health/ready
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

    networks:
      - backend_network
      

  # ---------------------------------------------------
  # Ingestor Nginx load balancer
  # ---------------------------------------------------
  ingester-load-balancer:
    image: nginx:alpine
    restart: unless-stopped

    expose:
      - "8080"

    volumes:
      - type: bind
        source: ./nginx/ingester-load-balancer.conf
        target: /etc/nginx/nginx.conf
        read_only: true

    depends_on:
      ingester-api:
        condition: service_started

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null
          http://127.0.0.1:8080/health/ready
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

    networks:
      - backend_network








volumes:
  backend_node_modules:
  redis_data:


networks:
  backend_network:
  public_network:




