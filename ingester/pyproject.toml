[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ingestor"
version = "2.0.0"
description = "Standalone DocuMind chunks.json to OpenSearch ingestion adapter"
requires-python = ">=3.11"
dependencies = [
  "opensearch-py>=3.2,<4",
  "pydantic>=2.12,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
documind-ingestor = "documind_ingestor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
