name: PDF-analyser tools Docker build

on:
  pull_request:
    paths:
      - "pdf-analyser/tools/api/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-build.yml"
  push:
    branches: [main]
    paths:
      - "/pdf-analyser/tools/api/**"
      - "docker-compose*.yml"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch:
    inputs:
      build_gpu:
        description: "Also build the CUDA 12.6 image"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cpu-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          build-args: |
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cpu
            TORCH_VERSION=2.11.0
            TORCHVISION_VERSION=0.26.0
          cache-from: type=gha,scope=extractor-cpu
          cache-to: type=gha,mode=max,scope=extractor-cpu

  gpu-image:
    if: github.event_name == 'workflow_dispatch' && inputs.build_gpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: false
          build-args: |
            TORCH_INDEX_URL=https://download.pytorch.org/whl/cu126
            TORCH_VERSION=2.11.0
            TORCHVISION_VERSION=0.26.0
          cache-from: type=gha,scope=extractor-gpu-cu126
          cache-to: type=gha,mode=max,scope=extractor-gpu-cu126
