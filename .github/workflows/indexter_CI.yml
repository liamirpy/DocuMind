name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}

  cancel-in-progress: true


env:
  PYTHON_VERSION: "3.12"


jobs:

  python-quality:

    name: Python quality and tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    defaults:
      run:
        working-directory: ./indexer 
  


    steps:

      - name: Check out repository

        uses: actions/checkout@v5


      - name: Set up Python

        uses: actions/setup-python@v6

        with:

          python-version:
            ${{ env.PYTHON_VERSION }}

          cache: pip

          cache-dependency-path: |

            requirements.txt

            requirements-dev.txt

            pyproject.toml


      - name: Install dependencies

        run: |

          python -m pip install \
            --upgrade pip

          python -m pip install \
            -r requirements-dev.txt


      - name: Ruff lint

        run: |

          python -m ruff \
            check .


      - name: Ruff formatting check

        run: |

          python -m ruff \
            format \
            --check .


      - name: Run tests

        env:

          # Prevent CI from downloading an embedding model.
          #
          # Your automated tests should use the deterministic
          # development embedding provider.

          HF_HUB_OFFLINE: "1"

          TRANSFORMERS_OFFLINE: "1"

          TOKENIZERS_PARALLELISM: "false"

        run: |

          python -m pytest \
            -q


      - name: Compile Python sources

        run: |

          python -m compileall \
            -q \
            app



  docker-validation:

    name: Docker validation and image build

    runs-on: ubuntu-latest

    timeout-minutes: 45

    needs:
      python-quality


    steps:

      - name: Check out repository

        uses: actions/checkout@v5


      - name: Prepare Compose environment

        run: |

          if [ -f .env.example ]; then

            cp \
              .env.example \
              .env

          else

            touch .env

          fi


          mkdir -p \
            "${RUNNER_TEMP}/documind-input" \
            "${RUNNER_TEMP}/documind-output"


          {

            echo \
              "APP_UID=$(id -u)"

            echo \
              "APP_GID=$(id -g)"

            echo \
              "DOCUMIND_INPUT_ROOT_HOST=${RUNNER_TEMP}/documind-input"

            echo \
              "DOCUMIND_OUTPUT_ROOT_HOST=${RUNNER_TEMP}/documind-output"

            echo \
              "MODEL_PRELOAD=false"

          } >> .env


      - name: Validate Docker Compose configuration

        run: |

          docker compose \
            config \
            --quiet


      - name: Set up Docker Buildx

        uses:
          docker/setup-buildx-action@v3


      - name: Build Docker image

        uses:
          docker/build-push-action@v6

        with:

          context: .

          file: ./Dockerfile

          push: false

          tags:
            documind-indexer-api:ci

          cache-from:
            type=gha

          cache-to:
            type=gha,mode=max

          build-args: |

            APP_UID=1000

            APP_GID=1000