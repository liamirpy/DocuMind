name: Publish images to GHCR

on:
  
  push:
    branches: [main]
  
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            torch_index: https://download.pytorch.org/whl/cpu
            suffix: cpu
          - variant: gpu-cu126
            torch_index: https://download.pytorch.org/whl/cu126
            suffix: gpu-cu126

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repository owner
        id: repo
        shell: bash
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ steps.repo.outputs.owner }}/pdf-extractor-api
          tags: |
            type=ref,event=tag,suffix=-${{ matrix.suffix }}
            type=raw,value=${{ matrix.suffix }}

      - uses: docker/build-push-action@v6
        with:
          context: pdf-analyser/tools/api
          file: pdf-analyser/tools/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TORCH_INDEX_URL=${{ matrix.torch_index }}
            TORCH_VERSION=2.11.0
            TORCHVISION_VERSION=0.26.0
          cache-from: type=gha,scope=publish-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.variant }}
