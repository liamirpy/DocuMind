name: Ingester CI

on:
  push:
    paths:
      - "ingester/**"
      - ".github/workflows/ingester-ci.yml"
  pull_request:
    paths:
      - "ingester/**"
      - ".github/workflows/ingester-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingester-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  INGESTER_DIR: ingester

jobs:
  python-quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ingester/pyproject.toml
            ingester/requirements.txt
            ingester/requirements-dev.txt

      - name: Install package and CI tools
        working-directory: ${{ env.INGESTER_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -e .
          python -m pip install "build>=1.2,<2"

      - name: Run Ruff lint checks
        working-directory: ${{ env.INGESTER_DIR }}
        run: python -m ruff check .

      - name: Check Ruff formatting
        working-directory: ${{ env.INGESTER_DIR }}
        run: python -m ruff format --check .

      - name: Run unit tests
        working-directory: ${{ env.INGESTER_DIR }}
        run: python -m pytest -q

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        working-directory: ${{ env.INGESTER_DIR }}
        run: |
          rm -rf build dist *.egg-info
          python -m build

      - name: Smoke-test the built wheel
        if: matrix.python-version == '3.12'
        working-directory: ${{ env.INGESTER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --force-reinstall dist/*.whl
          documind-ingestor \
            examples/chunks.json \
            --dry-run \
            --expected-embedding-dimensions 32 \
            | tee /tmp/ingester-wheel-smoke.log
          grep -q 'INGESTION_VALIDATED' /tmp/ingester-wheel-smoke.log
          grep -q '"status": "validated"' /tmp/ingester-wheel-smoke.log

      - name: Upload Python distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: documind-ingester-python-${{ github.sha }}
          path: ingester/dist/*
          if-no-files-found: error
          retention-days: 14

  docker-image:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: python-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./ingester
          file: ./ingester/Dockerfile
          push: false
          load: true
          tags: documind-ingester:ci
          cache-from: type=gha,scope=documind-ingester
          cache-to: type=gha,mode=max,scope=documind-ingester

      - name: Run container dry-run smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --mount type=bind,src="${{ github.workspace }}/ingester/examples",dst=/input,readonly \
            -e INPUT_FILE=/input/chunks.json \
            -e OPENSEARCH_EMBEDDING_DIMENSIONS=32 \
            -e INGESTOR_DRY_RUN=true \
            documind-ingester:ci \
            | tee /tmp/ingester-container-smoke.log

          grep -q 'INGESTION_VALIDATED' /tmp/ingester-container-smoke.log
          grep -q '"status": "validated"' /tmp/ingester-container-smoke.log

  opensearch-integration:
    name: OpenSearch 3.7 integration
    runs-on: ubuntu-latest
    needs: python-quality

    env:
      OPENSEARCH_URL: http://localhost:9200
      OPENSEARCH_INDEX: documind-chunks-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingester/pyproject.toml
            ingester/requirements.txt

      - name: Install ingester
        working-directory: ${{ env.INGESTER_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Configure the runner for OpenSearch
        run: sudo sysctl -w vm.max_map_count=262144

      - name: Start OpenSearch 3.7
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name documind-opensearch-ci \
            --publish 9200:9200 \
            --ulimit nofile=65536:65536 \
            --ulimit memlock=-1:-1 \
            --env "cluster.name=documind-ci-cluster" \
            --env "node.name=documind-ci-node" \
            --env "discovery.type=single-node" \
            --env "DISABLE_INSTALL_DEMO_CONFIG=true" \
            --env "DISABLE_SECURITY_PLUGIN=true" \
            --env "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m" \
            opensearchproject/opensearch:3.7.0

      - name: Wait for OpenSearch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error "${OPENSEARCH_URL}" > /tmp/opensearch-info.json; then
              cat /tmp/opensearch-info.json
              exit 0
            fi
            echo "Waiting for OpenSearch (${attempt}/60)..."
            sleep 2
          done

          echo "OpenSearch did not become ready." >&2
          docker logs documind-opensearch-ci || true
          exit 1

      - name: Prepare a 1024-dimension integration fixture
        working-directory: ${{ env.INGESTER_DIR }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path("examples/chunks.json")
          target = Path("/tmp/chunks-1024.json")
          payload = json.loads(source.read_text(encoding="utf-8"))

          payload["embedding"]["dimensions"] = 1024
          for chunk in payload["chunks"]:
              vector = chunk.get("embedding")
              if vector is None:
                  continue
              repeats = (1024 + len(vector) - 1) // len(vector)
              chunk["embedding"] = (vector * repeats)[:1024]
              chunk["embedding_dimensions"] = 1024

          target.write_text(
              json.dumps(payload, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(target)
          PY

      - name: Ingest fixture into OpenSearch
        working-directory: ${{ env.INGESTER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          documind-ingestor \
            /tmp/chunks-1024.json \
            --url "${OPENSEARCH_URL}" \
            --index "${OPENSEARCH_INDEX}" \
            --expected-embedding-dimensions 1024 \
            --install-template \
            --template-name documind-chunks-template-ci \
            --template-file templates/documind-chunks-template.json \
            --wait-timeout-seconds 120 \
            | tee /tmp/ingester-first-ingest.log

          grep -q 'INGESTION_DONE' /tmp/ingester-first-ingest.log
          grep -q '"status": "done"' /tmp/ingester-first-ingest.log

      - name: Verify document count
        shell: bash
        run: |
          set -euo pipefail
          count="$(
            curl --fail --silent --show-error \
              "${OPENSEARCH_URL}/${OPENSEARCH_INDEX}/_count" \
              | python -c 'import json, sys; print(json.load(sys.stdin)["count"])'
          )"
          echo "Indexed document count: ${count}"
          test "${count}" -eq 7

      - name: Re-ingest the same document
        working-directory: ${{ env.INGESTER_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          documind-ingestor \
            /tmp/chunks-1024.json \
            --url "${OPENSEARCH_URL}" \
            --index "${OPENSEARCH_INDEX}" \
            --expected-embedding-dimensions 1024 \
            --wait-timeout-seconds 120 \
            | tee /tmp/ingester-second-ingest.log

          grep -q 'INGESTION_DONE' /tmp/ingester-second-ingest.log

      - name: Verify re-ingestion is idempotent
        shell: bash
        run: |
          set -euo pipefail
          count="$(
            curl --fail --silent --show-error \
              "${OPENSEARCH_URL}/${OPENSEARCH_INDEX}/_count" \
              | python -c 'import json, sys; print(json.load(sys.stdin)["count"])'
          )"
          echo "Document count after second ingestion: ${count}"
          test "${count}" -eq 7

      - name: Show OpenSearch diagnostics on failure
        if: failure()
        shell: bash
        run: |
          curl --silent --show-error "${OPENSEARCH_URL}/_cluster/health?pretty" || true
          curl --silent --show-error "${OPENSEARCH_URL}/_cat/indices?v" || true
          docker logs documind-opensearch-ci || true

      - name: Stop OpenSearch
        if: always()
        run: docker rm --force documind-opensearch-ci || true
