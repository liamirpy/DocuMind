name: Backend CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend-check:
    name: Test backend with PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: documind
          POSTGRES_PASSWORD: ci_documind_password
          POSTGRES_DB: documind_postgresql
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U documind -d documind_postgresql"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      PORT: 8000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: documind
      DB_PASSWORD: ci_documind_password
      DB_NAME: documind_postgresql
      JWT_SECRET: ci_test_jwt_secret_do_not_use_in_production
      SESSION_DAYS: 7
      UPLOAD_DIR: src/uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-api/package-lock.json

      - name: Install PostgreSQL client
        run: |
          sudo apt update
          sudo apt install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if PGPASSWORD="$DB_PASSWORD" pg_isready -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME"; then
              echo "PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done

          echo "PostgreSQL was not ready in time"
          exit 1

      - name: Apply database schema
        working-directory: postgreSQL
        run: |
          PGPASSWORD="$DB_PASSWORD" psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_NAME" \
            -v ON_ERROR_STOP=1 \
            -f ./schema.sql

      - name: Install backend dependencies
        working-directory: backend-api
        run: npm ci

      - name: Create upload directory
        working-directory: backend-api
        run: mkdir -p src/uploads

      - name: Start backend server
        working-directory: backend-api
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/; then
              echo "Backend is ready"
              exit 0
            fi
            sleep 2
          done

          echo "Backend did not start in time"
          cat backend-api/server.log
          exit 1

      - name: Test register endpoint
        run: |
          curl -fsS -X POST http://localhost:8000/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{
              "firstname": "CI",
              "lastname": "User",
              "email": "ci-user@example.com",
              "password": "password123"
            }'

      - name: Show server logs if needed
        if: always()
        run: cat backend-api/server.log