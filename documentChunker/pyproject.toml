[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-indexer"
version = "4.1.0"
description = "FastAPI service for DocuMind chunking and dense embedding"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "numpy>=1.26,<3",
  "sentence-transformers>=5.6,<6",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
]

[project.scripts]
documind-indexer = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
